name: Build hosting release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Check tag and release metadata
        run: node -e 'const p=require("./package.json");if(process.env.GITHUB_REF_NAME!=="v"+p.version)throw new Error("Tag/version mismatch")'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - run: bash -n install.sh && bash -n deploy/scripts/idcardctl && bash -n deploy/scripts/harden.sh && bash -n deploy/scripts/security-check.sh
      - run: npm run package:production
      - name: Publish tagged hosting assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p 'require("./package.json").version')
          gh release create "$GITHUB_REF_NAME" .production-dist/multipurpose-card-manager-*.tar.gz .production-dist/SHA256SUMS.txt .production-dist/SBOM.cdx.json .production-dist/SOURCE-MANIFEST.json --verify-tag --title "Multipurpose Card Manager $version" --notes-file "docs/RELEASE-NOTES-$version.md"
